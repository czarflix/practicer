name: Deploy Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runner-service/**'
      - 'deploy/**'
      - '.github/workflows/runner-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Sync runner source
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '*.log' \
            runner-service/ "$EC2_USER@$EC2_HOST:/opt/dsa-runner-src/"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

      - name: Sync deploy files
        run: |
          rsync -az --delete deploy/ "$EC2_USER@$EC2_HOST:/opt/dsa-deploy/"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

      - name: Build and restart runner
        run: |
          ssh "$EC2_USER@$EC2_HOST" <<'EOF'
          set -euo pipefail
          docker build -t dsa-runner:latest /opt/dsa-runner-src
          cd /opt/dsa-runner
          docker compose up -d
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/healthz >/dev/null
          EOF
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
